<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="RTO Shield scoring pipeline">
<title>RTO Shield scoring pipeline</title>
<style>
text{font-family:Inter, Segoe UI, Arial, sans-serif;fill:#142022}
.serif{font-family:Cormorant Garamond, Georgia, serif}
.fb{transform-box:fill-box}
@keyframes f0{0%,5.00%{opacity:0;transform:translateY(14px)}10.00%,92.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.f0{animation:f0 12.0s cubic-bezier(.16,1,.3,1) infinite both;}
@keyframes f1{0%,10.00%{opacity:0;transform:translateY(14px)}15.00%,92.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.f1{animation:f1 12.0s cubic-bezier(.16,1,.3,1) infinite both;}
@keyframes f2{0%,15.00%{opacity:0;transform:translateY(14px)}20.00%,92.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.f2{animation:f2 12.0s cubic-bezier(.16,1,.3,1) infinite both;}
@keyframes f3{0%,20.00%{opacity:0;transform:translateY(14px)}25.00%,92.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.f3{animation:f3 12.0s cubic-bezier(.16,1,.3,1) infinite both;}
@keyframes f4{0%,25.00%{opacity:0;transform:translateY(14px)}30.00%,92.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.f4{animation:f4 12.0s cubic-bezier(.16,1,.3,1) infinite both;}
@keyframes c1{0%,31.67%{opacity:0}36.67%,92.00%{opacity:1}100%{opacity:0}}
.c1{animation:c1 12.0s cubic-bezier(.16,1,.3,1) infinite both;}
@keyframes bar{0%,36.67%{transform:scaleX(0)}53.33%,92.00%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
.bar{animation:bar 12.0s cubic-bezier(.16,1,.3,1) infinite both;transform-origin:0 50%;transform-box:fill-box}
@keyframes pv{0%,51.67%{opacity:0}56.67%,92.00%{opacity:1}100%{opacity:0}}
.pv{animation:pv 12.0s cubic-bezier(.16,1,.3,1) infinite both;}
@keyframes c2{0%,56.67%{opacity:0}61.67%,92.00%{opacity:1}100%{opacity:0}}
.c2{animation:c2 12.0s cubic-bezier(.16,1,.3,1) infinite both;}
@keyframes chip{0%,61.67%{opacity:0;transform:translateY(14px)}68.33%,92.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.chip{animation:chip 12.0s cubic-bezier(.16,1,.3,1) infinite both;}
@keyframes c3{0%,68.33%{opacity:0}75.00%,92.00%{opacity:1}100%{opacity:0}}
.c3{animation:c3 12.0s cubic-bezier(.16,1,.3,1) infinite both;}
@keyframes act{0%,75.00%{opacity:0;transform:translateY(14px)}82.50%,92.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.act{animation:act 12.0s cubic-bezier(.16,1,.3,1) infinite both;}
</style>
<rect width="1200" height="370" fill="#FAF5EE"/>
<text class="serif" x="40" y="44" font-size="26">One order, scored step by step</text>
<text x="40" y="68" font-size="12" style="fill:#936E6C">Illustrative values for one hypothetical order, not output from a real seller.</text>
<rect x="40" y="90" width="380" height="250" fill="#FAF5EE" stroke="#142022" stroke-width="1"/>
<text x="58" y="120" font-size="12" style="fill:#936E6C" letter-spacing="1">ORDER (EXAMPLE)</text>
<line x1="58" y1="132" x2="402" y2="132" stroke="#E0D8CC" stroke-width="1"/>
<g class="f0"><text x="58" y="160" font-size="13" style="fill:#936E6C">Payment</text><text x="402" y="160" font-size="14" text-anchor="end">Cash on Delivery</text><line x1="58" y1="170" x2="402" y2="170" stroke="#E0D8CC" stroke-width="1"/></g>
<g class="f1"><text x="58" y="194" font-size="13" style="fill:#936E6C">Placed at</text><text x="402" y="194" font-size="14" text-anchor="end">1:42 AM</text><line x1="58" y1="204" x2="402" y2="204" stroke="#E0D8CC" stroke-width="1"/></g>
<g class="f2"><text x="58" y="228" font-size="13" style="fill:#936E6C">Customer</text><text x="402" y="228" font-size="14" text-anchor="end">New customer</text><line x1="58" y1="238" x2="402" y2="238" stroke="#E0D8CC" stroke-width="1"/></g>
<g class="f3"><text x="58" y="262" font-size="13" style="fill:#936E6C">Pincode history</text><text x="402" y="262" font-size="14" text-anchor="end">Above benchmark</text><line x1="58" y1="272" x2="402" y2="272" stroke="#E0D8CC" stroke-width="1"/></g>
<g class="f4"><text x="58" y="296" font-size="13" style="fill:#936E6C">Address</text><text x="402" y="296" font-size="14" text-anchor="end">No landmark</text><line x1="58" y1="306" x2="402" y2="306" stroke="#E0D8CC" stroke-width="1"/></g>
<g class="c1"><line x1="420" y1="215" x2="470" y2="215" stroke="#142022" stroke-width="1"/><polygon points="470,215 462,211 462,219" fill="#142022"/>
<rect x="470" y="90" width="330" height="250" fill="#FAF5EE" stroke="#142022" stroke-width="1"/><text x="488" y="120" font-size="12" style="fill:#936E6C" letter-spacing="1">CALIBRATED MODEL</text><line x1="488" y1="132" x2="782" y2="132" stroke="#E0D8CC" stroke-width="1"/>
<text class="serif" x="488" y="176" font-size="22">RTO probability</text>
<rect x="488" y="196" width="294" height="12" fill="none" stroke="#142022" stroke-width="1"/>
<line x1="540.9" y1="192" x2="540.9" y2="212" stroke="#936E6C" stroke-width="1"/><text x="540.9" y="226" font-size="10" text-anchor="middle" style="fill:#936E6C">0.18</text>
<line x1="590.9" y1="192" x2="590.9" y2="212" stroke="#936E6C" stroke-width="1"/><text x="590.9" y="226" font-size="10" text-anchor="middle" style="fill:#936E6C">0.35</text>
</g>
<rect class="bar fb" x="489" y="197" width="137.2" height="10" fill="#A3443B"/>
<text class="pv serif" x="488" y="270" font-size="44">0.47</text>
<text class="pv" x="570" y="268" font-size="12" style="fill:#936E6C">top factors: COD, 1:42 AM, new customer</text>
<text class="pv" x="488" y="320" font-size="11" style="fill:#936E6C">tick marks: default thresholds 0.18 / 0.35</text>
<g class="c2"><line x1="800" y1="215" x2="850" y2="215" stroke="#142022" stroke-width="1"/><polygon points="850,215 842,211 842,219" fill="#142022"/></g>
<g class="chip"><rect x="850" y="90" width="310" height="120" fill="#FAF5EE" stroke="#142022" stroke-width="1"/><text x="868" y="120" font-size="12" style="fill:#936E6C" letter-spacing="1">TIER</text><rect x="868" y="134" width="96" height="30" rx="15" fill="none" stroke="#A3443B" stroke-width="1"/><text x="916" y="154" font-size="14" text-anchor="middle" style="fill:#A3443B">High</text><text x="976" y="154" font-size="12" style="fill:#936E6C">fairness guard: not triggered</text><text x="868" y="192" font-size="11" style="fill:#936E6C">Pincode alone cannot make an order High.</text></g>
<g class="c3"><path d="M1005,210 L1005,230" stroke="#142022" stroke-width="1" fill="none"/><polygon points="1005,230 1001,222 1009,222" fill="#142022"/></g>
<g class="act"><rect x="850" y="230" width="310" height="110" fill="#FAF5EE" stroke="#936E6C" stroke-width="1"/><text x="868" y="260" font-size="12" style="fill:#936E6C" letter-spacing="1">ACTION</text><text class="serif" x="868" y="292" font-size="24">Prepaid conversion nudge</text><text x="868" y="316" font-size="12" style="fill:#936E6C">Best expected value. Seller can override.</text><text x="868" y="332" font-size="12" style="fill:#936E6C">A share of flagged orders goes to holdout.</text></g>
</svg>