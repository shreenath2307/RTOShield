<rect width="1200" height="500" fill="#FAF5EE"/>
<path d="M290,136.0 L330,136.0" fill="none" stroke="#142022" stroke-width="1"/><path d="M580,136.0 L620,136.0" fill="none" stroke="#142022" stroke-width="1"/><path d="M870,136.0 L910,136.0" fill="none" stroke="#142022" stroke-width="1"/><path d="M995.0,192 L995.0,310" fill="none" stroke="#142022" stroke-width="1"/><path d="M910,366.0 L870,366.0" fill="none" stroke="#142022" stroke-width="1"/><path d="M620,366.0 L580,366.0" fill="none" stroke="#142022" stroke-width="1"/><path d="M330,366.0 L290,366.0" fill="none" stroke="#142022" stroke-width="1"/><path d="M165.0,310 L165.0,262 L1120,262 L1120,192" fill="none" stroke="#936E6C" stroke-width="1" class="flow"/><polygon points="330,136.0 322,132.0 322,140.0" fill="#142022"/><polygon points="620,136.0 612,132.0 612,140.0" fill="#142022"/><polygon points="910,136.0 902,132.0 902,140.0" fill="#142022"/><polygon points="995.0,310 991.0,302 999.0,302" fill="#142022"/><polygon points="870,366.0 878,362.0 878,370.0" fill="#142022"/><polygon points="580,366.0 588,362.0 588,370.0" fill="#142022"/><polygon points="290,366.0 298,362.0 298,370.0" fill="#142022"/><polygon points="1120,192 1116,200 1124,200" fill="#936E6C"/><rect x="40" y="80" width="250" height="112" fill="#FAF5EE" stroke="#142022" stroke-width="1"/><text class="serif" x="56" y="112" font-size="22">Store / CSV / Webhooks</text><text x="56" y="138" font-size="12.5" style="fill:#936E6C">Shopify, WooCommerce webhooks</text><text x="56" y="157" font-size="12.5" style="fill:#936E6C">CSV / XLSX upload</text><text x="56" y="176" font-size="12.5" style="fill:#936E6C">Live-order simulator</text><rect x="330" y="80" width="250" height="112" fill="#FAF5EE" stroke="#142022" stroke-width="1"/><text class="serif" x="346" y="112" font-size="22">Ingest and validate</text><text x="346" y="138" font-size="12.5" style="fill:#936E6C">Header mapping, quality report</text><text x="346" y="157" font-size="12.5" style="fill:#936E6C">HMAC-verified webhooks</text><text x="346" y="176" font-size="12.5" style="fill:#936E6C">Canonical order schema</text><rect x="620" y="80" width="250" height="112" fill="#FAF5EE" stroke="#142022" stroke-width="1"/><text class="serif" x="636" y="112" font-size="22">Feature engine</text><text x="636" y="138" font-size="12.5" style="fill:#936E6C">Leakage-safe customer and</text><text x="636" y="157" font-size="12.5" style="fill:#936E6C">pincode history (earlier orders)</text><text x="636" y="176" font-size="12.5" style="fill:#936E6C">Time-based split</text><rect x="910" y="80" width="250" height="112" fill="#FAF5EE" stroke="#936E6C" stroke-width="1"/><text class="serif" x="926" y="112" font-size="22">LightGBM + calibration</text><text x="926" y="138" font-size="12.5" style="fill:#936E6C">Blended with pincode benchmarks</text><text x="926" y="157" font-size="12.5" style="fill:#936E6C">on cold start: w = 500 / (n + 500)</text><text x="926" y="176" font-size="12.5" style="fill:#936E6C">Top reasons per score</text><rect x="910" y="310" width="250" height="112" fill="#FAF5EE" stroke="#936E6C" stroke-width="1"/><text class="serif" x="926" y="342" font-size="22">Policy</text><text x="926" y="368" font-size="12.5" style="fill:#936E6C">Cost-based: best expected value</text><text x="926" y="387" font-size="12.5" style="fill:#936E6C">Randomized holdout, no auto-cancel</text><text x="926" y="406" font-size="12.5" style="fill:#936E6C">Pincode fairness guard</text><rect x="620" y="310" width="250" height="112" fill="#FAF5EE" stroke="#142022" stroke-width="1"/><text class="serif" x="636" y="342" font-size="22">WhatsApp / SMS / Review</text><text x="636" y="368" font-size="12.5" style="fill:#936E6C">Confirmation messages</text><text x="636" y="387" font-size="12.5" style="fill:#936E6C">Seller review queue</text><text x="636" y="406" font-size="12.5" style="fill:#936E6C">Customer page /c/{token}</text><rect x="330" y="310" width="250" height="112" fill="#FAF5EE" stroke="#142022" stroke-width="1"/><text class="serif" x="346" y="342" font-size="22">Outcomes</text><text x="346" y="368" font-size="12.5" style="fill:#936E6C">DELIVERED or RTO</text><text x="346" y="387" font-size="12.5" style="fill:#936E6C">Seller decisions</text><text x="346" y="406" font-size="12.5" style="fill:#936E6C">Customer responses</text><rect x="40" y="310" width="250" height="112" fill="#FAF5EE" stroke="#142022" stroke-width="1"/><text class="serif" x="56" y="342" font-size="22">Impact, Drift, Fairness</text><text x="56" y="368" font-size="12.5" style="fill:#936E6C">Holdout z-test and CI</text><text x="56" y="387" font-size="12.5" style="fill:#936E6C">Drift (PSI)</text><text x="56" y="406" font-size="12.5" style="fill:#936E6C">Fairness audit</text><text x="175.0" y="252" font-size="12" style="fill:#936E6C" letter-spacing="1">RETRAIN LOOP: scheduled, or when drift PSI passes the threshold</text><text x="40" y="40" class="serif" font-size="26">One order, end to end</text><text x="40" y="460" font-size="12.5" style="fill:#936E6C">Lifecycle: webhook / API / CSV / simulator, score, policy, action, customer response, seller decision, outcome, retrain. Live updates reach the UI over SSE.</text><circle r="3.5" fill="#142022"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0.0s" path="M290,136.0 L330,136.0"/></circle><circle r="3.5" fill="#142022"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0.4s" path="M580,136.0 L620,136.0"/></circle><circle r="3.5" fill="#142022"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0.8s" path="M870,136.0 L910,136.0"/></circle><circle r="3.5" fill="#142022"><animateMotion dur="3.2s" repeatCount="indefinite" begin="1.2s" path="M995.0,192 L995.0,310"/></circle><circle r="3.5" fill="#142022"><animateMotion dur="3.2s" repeatCount="indefinite" begin="1.6s" path="M910,366.0 L870,366.0"/></circle><circle r="3.5" fill="#142022"><animateMotion dur="3.2s" repeatCount="indefinite" begin="2.0s" path="M620,366.0 L580,366.0"/></circle><circle r="3.5" fill="#142022"><animateMotion dur="3.2s" repeatCount="indefinite" begin="2.4s" path="M330,366.0 L290,366.0"/></circle><circle r="3.5" fill="#936E6C"><animateMotion dur="6s" repeatCount="indefinite" begin="2.8s" path="M165.0,310 L165.0,262 L1120,262 L1120,192"/></circle></svg>