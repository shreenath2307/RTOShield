<line x1="90" y1="157.5" x2="850" y2="157.5" stroke="#E0D8CC" stroke-width="1"/><text x="80" y="161.5" font-size="11" text-anchor="end" style="fill:#936E6C">0.75</text>
<line x1="90" y1="90.0" x2="850" y2="90.0" stroke="#E0D8CC" stroke-width="1"/><text x="80" y="94.0" font-size="11" text-anchor="end" style="fill:#936E6C">1.00</text>
