<g class="pt"><circle cx="216.7" cy="225.0" r="4" fill="#FAF5EE" stroke="#142022" stroke-width="1"/><text x="226.7" y="215.0" font-size="12">n = 500: 0.50 / 0.50</text><circle cx="596.7" cy="144.0" r="4" fill="#FAF5EE" stroke="#142022" stroke-width="1"/><text x="586.7" y="134.0" font-size="12" text-anchor="end">n = 2,000: 0.20 / 0.80</text></g>
<line x1="890" y1="120" x2="920" y2="120" stroke="#936E6C" stroke-width="2"/><text x="930" y="124" font-size="13">Pincode benchmark weight</text><text x="930" y="142" font-size="12" style="fill:#936E6C">w = 500 / (n + 500)</text>
<line x1="890" y1="180" x2="920" y2="180" stroke="#142022" stroke-width="2"/><text x="930" y="184" font-size="13">Trained model weight</text><text x="930" y="202" font-size="12" style="fill:#936E6C">1 - w = n / (n + 500)</text>
<text x="890" y="250" font-size="12" style="fill:#936E6C">At n = 0 the scorer is the</text><text x="890" y="268" font-size="12" style="fill:#936E6C">transparent benchmark model.</text><text x="890" y="286" font-size="12" style="fill:#936E6C">Cold-start scores are marked</text><text x="890" y="304" font-size="12" style="fill:#936E6C">as such in the API.</text>
</svg>