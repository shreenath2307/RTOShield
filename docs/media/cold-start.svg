<line x1="216.7" y1="360" x2="216.7" y2="365" stroke="#142022" stroke-width="1"/><text x="216.7" y="380" font-size="11" text-anchor="middle" style="fill:#936E6C">500</text>
<line x1="343.3" y1="360" x2="343.3" y2="365" stroke="#142022" stroke-width="1"/><text x="343.3" y="380" font-size="11" text-anchor="middle" style="fill:#936E6C">1000</text>
<line x1="470.0" y1="360" x2="470.0" y2="365" stroke="#142022" stroke-width="1"/><text x="470.0" y="380" font-size="11" text-anchor="middle" style="fill:#936E6C">1500</text>
