<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="RTO Shield cold start blending">
<title>RTO Shield cold start blending</title>
<style>
text{font-family:Inter, Segoe UI, Arial, sans-serif;fill:#142022}
.serif{font-family:Cormorant Garamond, Georgia, serif}
.fb{transform-box:fill-box}
@keyframes d1{0%,6.00%{stroke-dashoffset:1}40.00%,92.00%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.d1{animation:d1 10.0s cubic-bezier(.16,1,.3,1) infinite both;}
@keyframes d2{0%,6.00%{stroke-dashoffset:1}40.00%,92.00%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.d2{animation:d2 10.0s cubic-bezier(.16,1,.3,1) infinite both;}
@keyframes pt{0%,40.00%{opacity:0}48.00%,92.00%{opacity:1}100%{opacity:0}}
.pt{animation:pt 10.0s cubic-bezier(.16,1,.3,1) infinite both;}
.dl{stroke-dasharray:1;stroke-dashoffset:1}
</style>
<rect width="1200" height="420" fill="#FAF5EE"/>
<text class="serif" x="40" y="44" font-size="26">Cold start: benchmarks first, own data as it arrives</text>
<text x="40" y="68" font-size="12" style="fill:#936E6C">n = labelled orders the seller has. Constant PRIOR_BLEND_K = 500 in backend/app/ml/scorer.py.</text>
